<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireLink Games</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina">
    <canvas id="xmb"></canvas>

    <div class="app-shell">
        <header class="topbar panel">
            <div class="brand-block">
                <h1>FireLink Games</h1>
            </div>

            <form class="searchbar" role="search">
                <label class="sr-only" for="buscador">Buscar un videojuego</label>
                <input type="search" id="buscador" name="buscador" placeholder="Buscar por titulo, genero o plataforma"
                    autocomplete="off">
            </form>

            <div class="topbar-auth">
                <details class="login-dropdown">
                    <summary class="login-toggle">Entrar</summary>

                    <div class="login-panel">
                        <form id="login-form" class="login-form" autocomplete="on">
                            <label class="sr-only" for="usuario">Usuario</label>
                            <input type="text" id="usuario" name="usuario" class="login-input" placeholder="Usuario"
                                required>

                            <label class="sr-only" for="password">Contrasena</label>
                            <input type="password" id="password" name="password" class="login-input"
                                placeholder="Contrasena" required>

                            <button type="submit" class="login-submit">Iniciar sesion</button>
                        </form>

                        <div class="login-status">
                            <p id="login-msg" class="login-msg" aria-live="polite"></p>

                            <div id="zona-privada" class="oculto">
                                <button id="btn-admin" type="button" class="login-pill">Anadir juego</button>
                            </div>
                        </div>
                    </div>
                </details>
            </div>
        </header>

        <!-- anadir juego -->
        <div id="form-add-juego" class="modal-insertar oculto">
            <div class="modal-content">
                <h3>Anadir nuevo juego</h3>
                <form id="insert-form">
                    <input type="text" id="juego-nombre" placeholder="Nombre del juego" required>
                    <textarea id="juego-descripcion" placeholder="Descripcion" required></textarea>
                    <input type="text" id="juego-imagen" placeholder="URL de la contenedor-magen">
                    <input type="text" id="juego-genero" list="lista-generos" placeholder="Genero" required>
                    <datalist id="lista-generos"></datalist>
                    <input type="text" id="juego-developer" list="lista-developers" placeholder="Desarrollador"
                        required>
                    <datalist id="lista-developers"></datalist>
                    <input type="date" id="juego-fecha">
                    <input type="number" id="juego-precio" placeholder="Precio" step="0.01">
                    <input type="number" id="juego-duracion" placeholder="Duracion">
                    <input type="number" id="juego-valoracion" placeholder="Valoracion (1-10)" min="1" max="10">
                    <input type="text" id="juego-plataform" placeholder="Plataformas">
                    <button type="submit">Guardar juego</button>
                    <button type="button" id="btn-cerrar-modal">Cancelar</button>
                </form>
            </div>
        </div>

        <div class="layout-principal">
            <aside class="sidebar panel">
                <p class="sidebar-title">Categorias</p>
                <nav aria-label="Filtros del catalogo">
                    <ul class="sidebar-list">
                        <li><button class="btn-filtro active" data-cat="todos" type="button">Todos</button></li>
                        <li><button class="btn-filtro" data-cat="accion" type="button">Accion</button></li>
                        <li><button class="btn-filtro" data-cat="aventura" type="button">Aventura</button></li>
                        <li><button class="btn-filtro" data-cat="rpg" type="button">RPG</button></li>
                        <li><button class="btn-filtro" data-cat="indie" type="button">Indie</button></li>
                        <li><button class="btn-filtro" data-cat="estrategia" type="button">Estrategia</button></li>
                        <li><button class="btn-filtro" data-cat="multijugador" type="button">Multijugador</button></li>
                        <li><button class="btn-filtro" data-cat="mundoAbierto" type="button">Mundo abierto</button></li>
                    </ul>
                </nav>
            </aside>

            <main class="contenido-catalogo">
                <section class="catalogo-panel panel">
                    <div class="catalogo-header">
                        <div>
                            <p class="eyebrow">Catalogo</p>
                            <h2>Todos los juegos</h2>
                        </div>

                        <div class="catalogo-tools">
                            <label for="orden-juegos">Ordenar por</label>
                            <div class="select-wrap">
                                <select id="orden-juegos" name="orden-juegos">
                                    <option value="nombre">Nombre</option>
                                    <option value="fecha">Fecha de lanzamiento</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="catalogo-grid">
                        <div class="catalogo-grid-head">
                            <h3>Listado</h3>
                        </div>

                        <div id="contenedor-juegos" class="grid-juegos" aria-live="polite">
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="fondo.js"></script>
    <script src="script.js"></script>
</body>

</html>
