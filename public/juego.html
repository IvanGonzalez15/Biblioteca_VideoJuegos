<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del juego</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina">
    <canvas id="xmb"></canvas>

    <div class="app-shell">
        <div class="detalle-backbar">
            <a class="back-link" href="index.html">Volver al catalogo</a>
        </div>

        <main id="detalle-juego" class="detalle-layout">
            <section class="detalle-hero panel">
                <div>
                    <p class="eyebrow">Ficha del juego</p>
                    <h1 id="juego-titulo"></h1>
                    <p id="juego-descripcion-corta" class="detalle-resumen">

                    </p>

                    <div id="juego-tags" class="tag-list" aria-label="Etiquetas del juego">
                        <span class="tag"></span>
                        <span class="tag"></span>
                        <span class="tag"></span>
                    </div>
                </div>

                <div class="detalle-cover">
                    <div class="media-placeholder">
                        <img id="juego-portada" src="">
                    </div>
                </div>
            </section>

            <section class="detalle-contenido">
                <article class="panel detalle-bloque">
                    <h2>Informacion general</h2>
                    <div id="juego-meta" class="meta-grid">
                        <div class="meta-item">
                            <span class="meta-label">Lanzamiento</span>
                            <strong></strong>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Genero</span>
                            <strong></strong>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Desarrolladora</span>
                            <strong></strong>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Plataformas</span>
                            <strong></strong>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Precio</span>
                            <strong></strong>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Valoracion</span>
                            <strong></strong>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Duracion</span>
                            <strong></strong>
                        </div>
                    </div>
                </article>
            </section>
        </main>
    </div>

    <script src="fondo.js"></script>
    <script src="juego.js"></script>
</body>

</html>
